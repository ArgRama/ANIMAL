<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMAL — Receta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1638B8" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/iconos/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ANIMAL" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="doc-tools">
    <a class="back" id="back" href="javascript:history.back()"></a>
    <button class="btn" type="button" id="imprimir"></button>
  </div>
  <article class="doc" id="doc"></article>

  <script src="js/core.js"></script>
  <script src="js/docs.js"></script>
  <script>
    (async () => {
      const { icon, esc, $, api, fecha, edad, especie, SEXO } = HV;
      await HV.init();
      $("#back").innerHTML = `${icon("back")}Volver`;
      $("#imprimir").innerHTML = `${icon("print")}Imprimir`;
      $("#imprimir").addEventListener("click", () => window.print());

      const [{ receta: r, animal: a, tutor: t }, clinica] = await Promise.all([
        api("GET", "/api/recetas/" + encodeURIComponent(HV.qs("id"))),
        api("GET", "/api/clinica"),
      ]).catch((e) => { $("#doc").innerHTML = `<div class="empty">${esc(e.message)}</div>`; throw e; });

      document.title = `Receta ${String(r.id).padStart(6, "0")} — ${a.nombre}`;
      const e = especie(a.especie);
      $("#doc").innerHTML = `
        ${Docs.cabecera(clinica, `<b>Receta Nº ${String(r.id).padStart(6, "0")}</b><br />Fecha: ${fecha(r.fecha)}`)}
        <h1 class="doc__title">Receta veterinaria${r.controlada ? " · psicotrópicos / estupefacientes" : ""}</h1>
        <div class="doc__grid">
          <div><b>Paciente:</b> ${esc(a.nombre)}${a.unidad === "rodeo" ? ` (rodeo, ${a.cantidad} cab.)` : ""}</div>
          <div><b>Especie / raza:</b> ${esc(e.nombre)}${a.raza ? " · " + esc(a.raza) : ""}</div>
          <div><b>Sexo / edad:</b> ${esc(SEXO[a.sexo])} · ${esc(edad(a.fecha_nac))}</div>
          <div><b>Peso:</b> ${a.peso ? a.peso + " kg" : "—"}</div>
          <div><b>Identificación:</b> ${esc(a.microchip ? "Microchip " + a.microchip : a.identificacion || "—")}</div>
          <div><b>Diagnóstico:</b> ${esc(r.diagnostico || "—")}</div>
          <div><b>Tutor / responsable:</b> ${esc(t.apellido)}, ${esc(t.nombre)}</div>
          <div><b>DNI / CUIT:</b> ${esc(t.dni)}</div>
          <div style="grid-column:1/-1"><b>Domicilio:</b> ${esc([t.direccion, t.ciudad, t.provincia].filter((x) => x && x !== "—").join(", ") || "—")}</div>
        </div>
        <div class="doc__rx">Rp/</div>
        ${r.items.map((i, n) => `<div class="doc__item"><b>${n + 1}. ${esc(i.producto)}</b>${i.presentacion ? " — " + esc(i.presentacion) : ""}${i.cantidad ? ` <span class="muted">(cant.: ${esc(i.cantidad)})</span>` : ""}
          <div>${esc([i.dosis, i.via && "vía " + i.via.toLowerCase(), i.frecuencia, i.duracion && "durante " + i.duracion].filter(Boolean).join(" · "))}</div></div>`).join("")}
        ${r.indicaciones ? `<p style="margin-top:16px;font-size:14px;line-height:1.55"><b>Indicaciones:</b> ${esc(r.indicaciones)}</p>` : ""}
        ${a.unidad === "rodeo" || e.grupo === "grandes" ? `<p style="font-size:13px"><b>Animal de producción:</b> respetar el período de retiro indicado por el fabricante para carne y leche.</p>` : ""}
        <div class="doc__sign"><div>${r.usuario_id ? `<img class="doc__firma" src="/api/usuarios/${r.usuario_id}/documentos/firma" alt="" onerror="this.remove()" />` : ""}Dr/a. ${esc(r.autor || "")}<br />Médico/a veterinario/a · ${esc(r.autor_matricula || "Mat. —")}${r.autor_ente ? "<br />" + esc(r.autor_ente) : ""}<br />Firma y sello</div></div>
        <p class="doc__foot">${r.controlada ? "Receta de productos controlados: el establecimiento debe archivar el original firmado. " : ""}
          Los productos alcanzados por la Receta Veterinaria Electrónica de SENASA deben registrarse también en la plataforma oficial.</p>`;
    })();
  </script>
</body>
</html>
